# Input-token estimate used to route a lane to a model whose context_budget fits.
# est_tokens = ceil(input bytes / bytes_per_token) + lane_base_tokens.
# bytes_per_token -- established: transcript usage deltas, 2026-10-12 (measured
#   floor on diff + CLAUDE.md text).
# lane_base_tokens -- established: a bare git-kit:review-lane-low Haiku subagent
#   in plugins-kit measured 80,141 first-turn tokens on 2026-10-12. The
#   auto-loaded project-root CLAUDE.md (113,832 B, about 45.5k tokens at
#   bytes_per_token) is counted separately from its actual bytes; the remainder
#   (about 34.6k: system prompt, tools, user-level instruction files, skill and
#   agent listings) rounds to 35000. Machine- and session-dependent; override in
#   the user or project layer.
context_estimate:
  bytes_per_token: 2.5
  lane_base_tokens: 35000
profiles:
- id: data_only
  selection:
    data_only_extensions:
    - .csv
    - .yaml
    - .yml
    - .json
    - .tsv
    - .md
  reviewers:
  # haiku runs a lane when its estimated input fits its context_budget, otherwise the next entry runs.
  - name: reviewer_a_claude_md_compliance
    model:
    - {id: haiku, effort: low}
    - {id: sonnet, effort: low}
    - {id: luna, effort: high}
  - name: reviewer_b_diff_only_bugs
    model:
    - {id: haiku, effort: low}
    - {id: sonnet, effort: low}
    - {id: luna, effort: high}
  # Validators are Claude-only by mechanism: a validator runs on an Agent entry only.
  validator_models:
    bug: [{id: haiku, effort: low}, {id: sonnet, effort: low}]
    claude_md: [{id: haiku, effort: low}, {id: sonnet, effort: low}]
- id: code
  selection: {}
  reviewers:
  # haiku runs a lane when its estimated input fits its context_budget, otherwise the next entry runs.
  - name: reviewer_a_claude_md_compliance
    model:
    - {id: haiku, effort: low}
    - {id: sonnet, effort: low}
    - {id: luna, effort: high}
  - name: reviewer_b_diff_only_bugs
    model:
    - {id: opus, effort: medium}
    - {id: sol, effort: medium}
  - name: reviewer_c_introduced_code
    model:
    - {id: sol, effort: high}
    - {id: opus, effort: high}
  # Validators are Claude-only by mechanism: a validator runs on an Agent entry only.
  validator_models:
    bug: [{id: opus, effort: medium}]
    claude_md: [{id: haiku, effort: low}, {id: sonnet, effort: low}]
